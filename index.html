
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>amin's chess</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f9ff; --sq1:#f0f9ff; --sq2:#d9effc;
  --ink:#3c3c3c; --main:#3fb8f5; --main-d:#1d96d4; --blue:#1d96d4;
  --card:#ffffff; --line:#e5e5e5;
  --light:#f5faff; --dark:#5ec0f2; --base:#1f6fa3;
  --s:clamp(30px,8vw,46px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Nunito','Trebuchet MS',system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.logo{position:fixed;z-index:3;left:20px;top:18px;font-size:clamp(26px,5vw,34px);font-weight:900;color:var(--main);letter-spacing:-.5px}
.btn{font:800 15px/1 'Nunito',sans-serif;letter-spacing:.8px;text-transform:uppercase;border-radius:16px;padding:15px 26px;cursor:pointer;
  border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--blue)}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.login{position:fixed;z-index:3;left:20px;bottom:20px}
.go{background:var(--main);color:#fff;border:0;border-bottom:4px solid var(--main-d);padding:17px 40px;font-size:16px}
.go:active{transform:translateY(4px);border-bottom-width:0}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:70px 20px;text-align:center}
h1{margin:0;font-weight:900;font-size:clamp(34px,6.4vw,66px);line-height:1.05;letter-spacing:-1px;max-width:15ch}
.scene{perspective:1100px;width:100%;height:calc(var(--s)*9.4);display:flex;align-items:center;justify-content:center;margin-top:calc(var(--s)*.4)}
.board{--rz:-32;position:relative;width:calc(var(--s)*8);height:calc(var(--s)*8);transform-style:preserve-3d;transform:rotateX(56deg) rotateZ(-32deg)}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);transform-style:preserve-3d;border:3px solid var(--base)}
.sq{position:relative;transform-style:preserve-3d}
.sq.l{background:var(--light)} .sq.d{background:var(--dark)}
.layer{position:absolute;inset:0;background:var(--base);border-radius:4px}
.shadow{position:absolute;inset:-6%;background:rgba(0,0,0,.22);filter:blur(18px);border-radius:12px}
.pc{position:absolute;left:calc(50% - var(--s)*.65);top:calc(50% - var(--s)*1.3);width:calc(var(--s)*1.3);height:calc(var(--s)*1.3);
  display:flex;align-items:flex-end;justify-content:center;font-size:calc(var(--s)*1.15);line-height:1;transform-origin:50% 100%;
  transform:rotateZ(calc(var(--rz)*-1deg)) rotateX(-90deg);user-select:none}
.pc.w{color:#fff;text-shadow:-1px 0 #2d2d2d,1px 0 #2d2d2d,0 -1px #2d2d2d,0 1px #2d2d2d,0 3px 0 #2d2d2d}
.pc.b{color:#2b2b2b;text-shadow:0 0 1px #fff,0 2px 0 #000}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="logo">amin's chess</div>
<button class="btn login">log in</button>
<main>
  <h1>learn chess one move at a time</h1>
  <div class="scene"><div class="board" id="board"></div></div>
  <button class="btn go">get started</button>
</main>
<script>
// ---------- 3D board (built first so it always shows) ----------
var board=document.getElementById('board');
var shadow=document.createElement('div');shadow.className='shadow';
shadow.style.transform='translateZ(-26px)';board.appendChild(shadow);
for(var i=1;i<=14;i++){
  var l=document.createElement('div');l.className='layer';
  l.style.transform='translateZ(-'+i+'px)';
  l.style.filter='brightness('+(1-i*.012)+')';
  board.appendChild(l);
}
var grid=document.createElement('div');grid.className='grid';board.appendChild(grid);
var back=['♜','♞','♝','♛','♚','♝','♞','♜'];
for(var r=0;r<8;r++){for(var f=0;f<8;f++){
  var sq=document.createElement('div');sq.className='sq '+((r+f)%2?'d':'l');
  var g=null,side='';
  if(r===0){g=back[f];side='b'}
  else if(r===1){g='♟';side='b'}
  else if(r===6){g='♟';side='w'}
  else if(r===7){g=back[f];side='w'}
  if(g){var p=document.createElement('div');p.className='pc '+side;p.textContent=g+'\uFE0E';sq.appendChild(p)}
  grid.appendChild(sq);
}}

// ---------- wavy checkered background ----------
var cv=document.getElementById('bg'),cx=cv.getContext('2d');
var W,H,dpr;
function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);size();
function draw(t){
  var c=Math.max(48,Math.min(W,H)/9),cols=Math.ceil(W/c)+5,rows=Math.ceil(H/c)+5;
  var drift=(t*0.02)%(2*c);
  cx.fillStyle='#f0f9ff';cx.fillRect(0,0,W,H);
  var pts=[];
  for(var j=0;j<=rows;j++){for(var i=0;i<=cols;i++){
    var x=i*c-2*c+drift,y=j*c-2*c+drift*.5;
    pts.push([x+Math.sin(y*.011+t*.0014)*c*.4, y+Math.cos(x*.011+t*.0011)*c*.4]);
  }}
  cx.fillStyle='#d9effc';
  for(var j=0;j<rows;j++){for(var i=0;i<cols;i++){
    if((i+j)&1)continue;
    var a=pts[j*(cols+1)+i],b=pts[j*(cols+1)+i+1],d=pts[(j+1)*(cols+1)+i+1],e=pts[(j+1)*(cols+1)+i];
    cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.lineTo(d[0],d[1]);cx.lineTo(e[0],e[1]);cx.fill();
  }}
}

// ---------- animation loop ----------
var mx=0,my=0,tx=0,ty=0;
addEventListener('pointermove',function(e){tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
function frame(t){
  mx+=(tx-mx)*.06;my+=(ty-my)*.06;
  var rz=-32+Math.sin(t/2600)*14+mx*26, rx=56-my*10, fl=Math.sin(t/900)*6;
  board.style.setProperty('--rz',rz);
  board.style.transform='translateZ('+fl+'px) rotateX('+rx+'deg) rotateZ('+rz+'deg)';
  try{draw(t)}catch(err){}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
